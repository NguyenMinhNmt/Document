<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Hệ thống Tài Liệu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* UI Design Concept: Modern Clean Card */
    body {
      background-color: #F8FAFC;
      font-family: 'Be Vietnam Pro', sans-serif;
      margin: 0;
    }

    .auth-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .auth-card {
      background: #FFFFFF;
      width: 100%;
      max-width: 440px;
      padding: 2.5rem 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    .brand-logo {
      width: 56px;
      height: 56px;
      background: #1E293B;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      font-weight: bold;
      border-radius: 50%;
      margin: 0 auto 1rem;
    }

    .auth-title {
      text-align: center;
      color: #0F172A;
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .auth-subtitle {
      text-align: center;
      color: #64748B;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.5rem;
    }

    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #CBD5E1;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }

    .form-control:focus {
      outline: none;
      border-color: #4F46E5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .btn-primary {
      width: 100%;
      padding: 0.85rem;
      background: #4F46E5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover:not(:disabled) {
      background: #4338CA;
    }

    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .link-group {
      display: flex;
      justify-content: space-between;
      margin-top: 0.5rem;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
    }

    .link-item {
      color: #4F46E5;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }

    .link-item:hover {
      text-decoration: underline;
    }

    /* Ô nhập OTP to, bự, 1 ô duy nhất */
    .otp-input-single {
      text-align: center;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 8px;
      padding: 1rem;
      color: #1E293B;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #333;
      color: white;
      padding: 1rem;
      border-radius: 8px;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s;
      z-index: 9999;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>

<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="brand-logo" id="siteLogo">T</div>
      <h2 class="auth-title" id="authTitle">Đăng nhập</h2>
      <p class="auth-subtitle" id="authSubTitle">Chào mừng bạn quay trở lại <span id="siteName">Web Tài Liệu</span></p>

      <!-- 1. ĐĂNG NHẬP -->
      <form id="loginForm">
        <div class="form-group">
          <label>Email hoặc Tên tài khoản</label>
          <input type="text" class="form-control" id="loginEmail" required placeholder="Nhập username hoặc email...">
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" class="form-control" id="loginPassword" required placeholder="••••••••">
        </div>
        <div class="link-group">
          <a class="link-item" id="btnShowForgot">Quên mật khẩu?</a>
          <a class="link-item" id="btnShowRegister">Tạo tài khoản mới</a>
        </div>
        <button type="submit" class="btn-primary" id="loginSubmitBtn">Đăng nhập</button>
      </form>

      <!-- 2. ĐĂNG KÝ / QUÊN MK -->
      <form id="registerForm" style="display: none;">
        <div class="form-group" id="fieldRegName">
          <label>Tên hiển thị (Username)</label>
          <input type="text" class="form-control" id="regName" placeholder="Ví dụ: Nmt">
        </div>
        <div class="form-group">
          <label>Email chính xác</label>
          <input type="email" class="form-control" id="regEmail" required placeholder="nhapemail@gmail.com">
        </div>
        <div class="form-group" id="fieldRegPass">
          <label>Mật khẩu</label>
          <input type="password" class="form-control" id="regPassword" placeholder="••••••••">
        </div>
        <div class="link-group" style="justify-content: flex-end;">
          <a class="link-item" id="btnShowLoginFromReg">Quay lại Đăng nhập</a>
        </div>
        <button type="submit" class="btn-primary" id="regSubmitBtn">Tiếp tục</button>
      </form>

      <!-- 3. NHẬP OTP (1 Ô DUY NHẤT) -->
      <form id="otpForm" style="display: none;">
        <p style="text-align: center; font-size: 0.9rem; margin-bottom: 1.5rem;">
          Mã xác thực đã được gửi tới email:<br><strong id="otpTargetEmail" style="color: #4F46E5;">---</strong>
        </p>
        <div class="form-group">
          <input type="text" class="form-control otp-input-single" id="otpSingleInput" required autofocus
            placeholder="Nhập mã OTP...">
        </div>
        <div style="text-align: center; margin-bottom: 1.5rem;">
          <span id="otpTimerLabel" style="font-size: 0.85rem; color: #64748B;">Gửi lại mã sau 60s</span>
          <a id="btnResendOtp" class="link-item" style="display: none; font-size: 0.85rem;">🔄 Gửi lại mã OTP</a>
        </div>
        <button type="submit" class="btn-primary" id="otpSubmitBtn">Xác thực & Hoàn tất</button>
      </form>

      <!-- 4. ĐẶT MẬT KHẨU MỚI -->
      <form id="resetPasswordForm" style="display: none;">
        <div class="form-group">
          <label>Mật khẩu mới</label>
          <input type="password" class="form-control" id="newPassword" required placeholder="••••••••">
        </div>
        <div class="form-group">
          <label>Xác nhận mật khẩu mới</label>
          <input type="password" class="form-control" id="confirmNewPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary" id="resetPassSubmitBtn">Lưu mật khẩu mới</button>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"><strong id="toastTitle"></strong>
    <div id="toastMessage"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <!-- THÊM ?v=1 để chống Cache -->
  <script src="../js/auth.js?v=1"></script>
</body>

</html>
