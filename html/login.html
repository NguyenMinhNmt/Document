<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Web Tài Liệu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <div class="auth-split-wrapper">

    <!-- CỘT TRÁI: FORM ĐĂNG NHẬP (GIAO DIỆN CARD CŨ) -->
    <div class="auth-left-panel">
      <div class="auth-card">
        <h2 class="auth-title" id="authTitle">Đăng nhập</h2>
        <p class="auth-subtitle" id="authSubTitle">Chào mừng bạn quay trở lại <span id="siteName">Web Tài Liệu</span>
        </p>

        <!-- 1. FORM ĐĂNG NHẬP -->
        <form id="loginForm">
          <div class="form-group">
            <label for="loginEmail">Email hoặc Username</label>
            <input type="text" class="form-control" id="loginEmail" required placeholder="Nhập username hoặc email...">
          </div>
          <div class="form-group">
            <label for="loginPassword">Mật khẩu</label>
            <div class="password-input-wrap">
              <input type="password" class="form-control" id="loginPassword" required placeholder="••••••••">
              <button type="button" class="toggle-pass-btn"
                onclick="togglePasswordVisibility('loginPassword', this)">👁️</button>
            </div>
          </div>
          <div class="link-group">
            <a class="link-item" id="btnShowForgot">Quên mật khẩu?</a>
            <a class="link-item" id="btnShowRegister">Tạo tài khoản mới</a>
          </div>
          <button type="submit" class="btn-primary" id="loginSubmitBtn">Đăng nhập</button>
        </form>

        <!-- 2. FORM ĐĂNG KÝ HOẶC QUÊN MẬT KHẨU -->
        <form id="registerForm" class="hidden-form">
          <div class="form-group" id="fieldRegName">
            <label for="regName" id="lblRegName">Tên hiển thị (Username)</label>
            <input type="text" class="form-control" id="regName" placeholder="Ví dụ: Nmt">
          </div>
          <div class="form-group">
            <label for="regEmail">Email nhận mã xác thực</label>
            <input type="email" class="form-control" id="regEmail" required placeholder="nhapemail@gmail.com">
          </div>
          <div class="form-group" id="fieldRegPass">
            <label for="regPassword">Mật khẩu</label>
            <div class="password-input-wrap">
              <input type="password" class="form-control" id="regPassword" placeholder="••••••••">
              <button type="button" class="toggle-pass-btn"
                onclick="togglePasswordVisibility('regPassword', this)">👁️</button>
            </div>
          </div>
          <div class="link-group-right">
            <a class="link-item" id="btnShowLoginFromReg">Quay lại Đăng nhập</a>
          </div>
          <button type="submit" class="btn-primary" id="regSubmitBtn">Tiếp tục</button>
        </form>

        <!-- 3. FORM TẠO MẬT KHẨU MỚI -->
        <form id="resetPasswordForm" class="hidden-form">
          <div class="form-group">
            <label for="newPassword">Mật khẩu mới</label>
            <div class="password-input-wrap">
              <input type="password" class="form-control" id="newPassword" required placeholder="••••••••">
              <button type="button" class="toggle-pass-btn"
                onclick="togglePasswordVisibility('newPassword', this)">👁️</button>
            </div>
          </div>
          <div class="form-group">
            <label for="confirmNewPassword">Xác nhận mật khẩu mới</label>
            <div class="password-input-wrap">
              <input type="password" class="form-control" id="confirmNewPassword" required placeholder="••••••••">
              <button type="button" class="toggle-pass-btn"
                onclick="togglePasswordVisibility('confirmNewPassword', this)">👁️</button>
            </div>
          </div>
          <button type="submit" class="btn-primary" id="resetPassSubmitBtn">Lưu mật khẩu mới</button>
        </form>
      </div>
    </div>

    <!-- CỘT PHẢI: LOGO ĐƯỢC BO TRÒN 50% -->
    <div class="auth-right-panel" id="siteLogoContainer">
      <!-- Thay src bằng link ảnh thật của bạn -->
      <img src="https://i.imgur.com/B9B5o6p.png" alt="Logo" class="circle-logo" id="siteLogoImg">
    </div>

  </div>

  <div class="toast" id="toast">
    <strong id="toastTitle">Thông báo</strong>
    <div id="toastMessage">Nội dung thông báo</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js?v=103"></script>
</body>

</html>
