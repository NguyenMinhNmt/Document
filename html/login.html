<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Hệ thống</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="login-body">
  <div class="auth-split-layout">

    <!-- CỘT TRÁI: FORM ĐĂNG NHẬP / ĐĂNG KÝ -->
    <div class="auth-left">
      <h1 class="main-heading" id="authTitle">Nền tảng Tài liệu<br><span id="siteName">Số hóa</span></h1>
      <p class="sub-heading" id="authSubTitle">Chào mừng bạn quay trở lại hệ thống</p>

      <!-- 1. FORM ĐĂNG NHẬP -->
      <form id="loginForm">
        <div class="form-group">
          <input type="text" class="form-control" id="loginEmail" required placeholder="👤  Tên đăng nhập hoặc email">
        </div>
        <div class="form-group">
          <div class="password-input-wrap">
            <input type="password" class="form-control" id="loginPassword" required placeholder="🔒  Mật khẩu">
            <button type="button" class="toggle-pass-btn"
              onclick="togglePasswordVisibility('loginPassword', this)">👁️</button>
          </div>
        </div>

        <div class="remember-box">
          <input type="checkbox" id="rememberMe" checked>
          <label for="rememberMe">Ghi nhớ mật khẩu</label>
        </div>

        <p class="note-text">Chú ý: Nếu bạn chưa có tài khoản, vui lòng chọn đăng ký tài khoản mới bên dưới!</p>

        <button type="submit" class="btn-primary" id="loginSubmitBtn">Đăng nhập hệ thống <span>&gt;</span></button>

        <div class="extra-actions">
          <button type="button" class="btn-secondary-outline" id="btnShowRegister">Đăng ký tài khoản mới
            <span>&gt;</span></button>
          <a class="link-item" id="btnShowForgot">Quên mật khẩu?</a>
        </div>
      </form>

      <!-- 2. FORM ĐĂNG KÝ (Mặc định ẩn) -->
      <form id="registerForm" class="hidden-form">
        <div class="form-group" id="fieldRegName">
          <input type="text" class="form-control" id="regName" placeholder="👤  Tên hiển thị (Username)">
        </div>
        <div class="form-group">
          <input type="email" class="form-control" id="regEmail" required placeholder="✉️  Email nhận mã xác thực">
        </div>
        <div class="form-group" id="fieldRegPass">
          <div class="password-input-wrap">
            <input type="password" class="form-control" id="regPassword" placeholder="🔒  Mật khẩu">
            <button type="button" class="toggle-pass-btn"
              onclick="togglePasswordVisibility('regPassword', this)">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="regSubmitBtn">Đăng ký tài khoản <span>&gt;</span></button>

        <div class="extra-actions">
          <button type="button" class="btn-secondary-outline" id="btnShowLoginFromReg"><span>&lt;</span> Quay lại Đăng
            nhập</button>
        </div>
      </form>

      <!-- 3. FORM QUÊN MẬT KHẨU (Mặc định ẩn) -->
      <form id="resetPasswordForm" class="hidden-form">
        <div class="form-group">
          <div class="password-input-wrap">
            <input type="password" class="form-control" id="newPassword" required placeholder="🔒  Mật khẩu mới">
            <button type="button" class="toggle-pass-btn"
              onclick="togglePasswordVisibility('newPassword', this)">👁️</button>
          </div>
        </div>
        <div class="form-group">
          <div class="password-input-wrap">
            <input type="password" class="form-control" id="confirmNewPassword" required
              placeholder="🔒  Xác nhận mật khẩu mới">
            <button type="button" class="toggle-pass-btn"
              onclick="togglePasswordVisibility('confirmNewPassword', this)">👁️</button>
          </div>
        </div>
        <button type="submit" class="btn-primary" id="resetPassSubmitBtn">Lưu mật khẩu mới <span>&gt;</span></button>
      </form>
    </div>

    <!-- CỘT PHẢI: LOGO / HÌNH ẢNH MINH HỌA -->
    <div class="auth-right" id="siteLogoContainer">
      <!-- Bạn có thể thay đường link ảnh này bằng ảnh logo thật của bạn -->
      <img src="https://i.imgur.com/B9B5o6p.png" alt="Illustration" id="siteLogoImg">
    </div>

  </div>

  <div class="toast" id="toast">
    <strong id="toastTitle">Thông báo</strong>
    <div id="toastMessage">Nội dung thông báo</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js?v=102"></script>
</body>

</html>
