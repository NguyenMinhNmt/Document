<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập & Đăng ký - Web Tài Liệu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .auth-container {
      max-width: 420px;
      margin: 3rem auto;
      padding: 2rem;
    }

    .otp-inputs {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin: 1rem 0;
    }

    .otp-inputs input {
      width: 45px;
      height: 50px;
      text-align: center;
      font-size: 1.25rem;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }
  </style>
</head>

<body>
  <div class="app-shell" style="justify-content: center; align-items: center; min-height: 100vh;">
    <div class="card auth-container">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <span class="brand-mark" style="width: 48px; height: 48px; font-size: 1.5rem; margin: 0 auto 0.5rem;">T</span>
        <h2 id="authTitle">Đăng nhập tài khoản</h2>
        <p id="authSubTitle" style="color: var(--text-sub); font-size: 0.85rem;">Hệ thống chia sẻ tài liệu trực tuyến
        </p>
      </div>

      <!-- FORM ĐĂNG NHẬP -->
      <form id="loginForm">
        <div class="form-field" style="margin-bottom: 1rem;">
          <label for="loginEmail">Email hoặc Tên tài khoản</label>
          <input class="form-control" type="text" id="loginEmail" required
            placeholder="nhapemail@gmail.com hoặc username">
        </div>
        <div class="form-field" style="margin-bottom: 1rem;">
          <label for="loginPassword">Mật khẩu</label>
          <input class="form-control" type="password" id="loginPassword" required placeholder="••••••••">
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
          <a href="#" id="btnShowForgot"
            style="font-size:0.8rem; color:var(--accent-1); text-decoration:underline;">Quên mật khẩu?</a>
          <a href="#" id="btnShowRegister"
            style="font-size:0.8rem; color:var(--accent-1); text-decoration:underline;">Tạo tài khoản mới</a>
        </div>
        <button type="submit" class="button button-primary" id="loginSubmitBtn"
          style="width: 100%; justify-content: center;">Đăng nhập</button>
      </form>

      <!-- FORM ĐĂNG KÝ -->
      <form id="registerForm" hidden>
        <div class="form-field" id="fieldRegName" style="margin-bottom: 1rem;">
          <label for="regName">Tên hiển thị (Username)</label>
          <input class="form-control" type="text" id="regName" placeholder="Nguyễn Văn A">
        </div>
        <div class="form-field" style="margin-bottom: 1rem;">
          <label for="regEmail">Email chính xác</label>
          <input class="form-control" type="email" id="regEmail" required placeholder="nhapemail@gmail.com">
        </div>
        <div class="form-field" id="fieldRegPass" style="margin-bottom: 1rem;">
          <label for="regPassword">Mật khẩu</label>
          <input class="form-control" type="password" id="regPassword" placeholder="••••••••">
        </div>
        <div style="text-align:right; margin-bottom:1.5rem;">
          <a href="#" id="btnShowLoginFromReg"
            style="font-size:0.8rem; color:var(--accent-1); text-decoration:underline;">Quay lại Đăng nhập</a>
        </div>
        <button type="submit" class="button button-primary" id="regSubmitBtn"
          style="width: 100%; justify-content: center;">Tiếp tục (Nhận mã OTP)</button>
      </form>

      <!-- FORM XÁC THỰC MÃ OTP (6 CHỮ SỐ) -->
      <form id="otpForm" hidden>
        <p style="text-align: center; font-size: 0.9rem;">Mã OTP 6 số đã được gửi tới email:<br><strong
            id="otpTargetEmail">---</strong></p>
        <div class="otp-inputs">
          <input class="form-control otp-digit" type="text" maxlength="1" required autofocus>
          <input class="form-control otp-digit" type="text" maxlength="1" required>
          <input class="form-control otp-digit" type="text" maxlength="1" required>
          <input class="form-control otp-digit" type="text" maxlength="1" required>
          <input class="form-control otp-digit" type="text" maxlength="1" required>
          <input class="form-control otp-digit" type="text" maxlength="1" required>
        </div>
        <div style="text-align: center; margin-bottom: 1rem; font-size:0.8rem; color:var(--text-sub);">
          <span id="otpTimerLabel">Gửi lại mã sau 60s</span>
          <button type="button" id="btnResendOtp" class="button button-secondary"
            style="margin: 0 auto; padding: 0.25rem 0.75rem; font-size:0.8rem;" hidden>🔄 Gửi lại mã OTP</button>
        </div>
        <button type="submit" class="button button-primary" id="otpSubmitBtn"
          style="width: 100%; justify-content: center;">Xác thực & Hoàn tất</button>
      </form>

      <!-- FORM ĐẶT LẠI MẬT KHẨU MỚI -->
      <form id="resetPasswordForm" hidden>
        <div class="form-field" style="margin-bottom: 1rem;">
          <label for="newPassword">Mật khẩu mới</label>
          <input class="form-control" type="password" id="newPassword" required placeholder="••••••••">
        </div>
        <div class="form-field" style="margin-bottom: 1.5rem;">
          <label for="confirmNewPassword">Xác nhận mật khẩu mới</label>
          <input class="form-control" type="password" id="confirmNewPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="button button-primary" id="resetPassSubmitBtn"
          style="width: 100%; justify-content: center;">Lưu mật khẩu mới</button>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"><span>✓</span>
    <div><strong id="toastTitle">Thông báo</strong>
      <p id="toastMessage"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
</body>

</html>
