<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xem Tài Liệu</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background: #1E293B;
      color: #fff;
      margin: 0;
      padding: 2rem;
      display: flex;
      gap: 2rem;
    }

    .preview-box {
      flex: 2;
      background: #fff;
      border-radius: 8px;
      min-height: 80vh;
      color: #000;
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .info-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .info-label {
      font-size: 0.8rem;
      color: #94A3B8;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .info-val {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .btn-download {
      background: #60A5FA;
      color: #fff;
      padding: 1rem;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      margin-top: auto;
      text-decoration: none;
      display: block;
    }

    .btn-download:hover {
      background: #3B82F6;
    }

    .hashtag {
      background: #334155;
      padding: 0.25rem 0.75rem;
      border-radius: 4px;
      font-size: 0.85rem;
      display: inline-block;
    }
  </style>
</head>

<body>

  <div class="preview-box">
    <!-- Khu vực iframe render DOCX/PDF -->
    <p id="previewMessage">Đang tải bản xem trước...</p>
  </div>

  <div class="info-box">
    <div>
      <div class="info-label">TÊN TÀI LIỆU</div>
      <div class="info-val" id="docName">---</div>
    </div>
    <div>
      <div class="info-label">NGƯỜI ĐĂNG TẢI</div>
      <div class="info-val" id="docUploader">---</div>
    </div>
    <div>
      <div class="info-label">THỜI GIAN ĐĂNG</div>
      <div class="info-val" id="docDate">---</div>
    </div>
    <div>
      <div class="info-label">MÔ TẢ</div>
      <div class="info-val" id="docDesc" style="font-weight: 400; font-size: 0.95rem;">---</div>
    </div>

    <a href="#" class="btn-download" id="btnDownload">⬇ Tải tài liệu về</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script>
    // Hàm tải dữ liệu Public
    async function loadPublicDocument() {
      const urlParams = new URLSearchParams(window.location.search);
      const fileId = urlParams.get('id');
      if (!fileId) return document.getElementById('previewMessage').textContent = "Không tìm thấy file!";

      try {
        // Giả sử bảng tên là 'file' và JOIN với 'user'. Cần sửa tên bảng cho đúng với dự án của bạn
        const { data, error } = await supabaseClient
          .from('file')
          .select('*, user(user_name)')
          .eq('id', fileId)
          .single();

        if (error || !data) throw new Error();

        document.getElementById('docName').textContent = data.file_name || "Tài liệu";
        // Nếu id_user bị NULL (do bị xóa) thì lấy tên "Người dùng ẩn danh"
        document.getElementById('docUploader').textContent = data.user?.user_name || "Người dùng ẩn danh";
        document.getElementById('docDate').textContent = new Date(data.created_at).toLocaleString('vi-VN');
        document.getElementById('docDesc').textContent = data.description || "Không có mô tả.";

        // Lấy link tải Public từ Storage (Giả sử bucket tên là 'documents')
        const { data: pubUrl } = supabaseClient.storage.from('documents').getPublicUrl(data.file_path);
        document.getElementById('btnDownload').href = pubUrl.publicUrl;
        document.getElementById('previewMessage').innerHTML = `<iframe src="${pubUrl.publicUrl}" width="100%" height="600px" style="border:none;"></iframe>`;

      } catch (err) {
        document.getElementById('previewMessage').textContent = "Tài liệu này không tồn tại hoặc đã bị xóa vào thùng rác.";
      }
    }
    loadPublicDocument();
  </script>
</body>

</html>
